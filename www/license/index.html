<!DOCTYPE html>
<html lang="en" data-theme="dark">

    <meta charset="UTF-8" />
    <script>
        // The docs' theme choice (docs-site/src/theme.ts), set before the page paints: the cs-theme cookie, then
        // localStorage, and dark when neither holds one
        try
        {
            const stored = document.cookie.split('; ').find(c => c.startsWith('cs-theme='))?.split('=')[1] ?? localStorage.getItem('cs-theme');
            if (stored === 'light') document.documentElement.dataset.theme = 'light';
        }
        catch
        {
            // Storage is blocked: the page stays dark
        }
    </script>
